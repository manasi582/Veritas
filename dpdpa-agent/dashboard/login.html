<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veritas — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #000;
      color: #ededed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #0c0c0c;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 48px rgba(0,0,0,0.7);
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #fff;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      font-size: 0.78rem;
      color: #555;
      margin-bottom: 2rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #888;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      background: #000;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: #ededed;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: rgba(255,255,255,0.35); }
    .btn {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      margin-top: 0.5rem;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: rgba(255,91,79,0.1);
      border: 1px solid rgba(255,91,79,0.3);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-size: 0.8rem;
      color: #ff5b4f;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/veritas-logo-32.png" />
  <link rel="apple-touch-icon" href="/static/img/veritas-logo-180.png" />
  <meta name="theme-color" content="#1e1e1e" />
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('veritas_theme')||'light'}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/veritas-auth.css" />
</head>
<body>
  <div class="card">
    <div class="brandmark"><img src="/static/img/veritas-logo-64.png" srcset="/static/img/veritas-logo-64.png 1x, /static/img/veritas-logo-192.png 3x" alt="" width="44" height="44" /><div class="logo">VERITAS</div></div>
    <div class="subtitle">DPDPA Compliance Platform — Sign In</div>

    <div class="error" id="errorBox"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             placeholder="Enter your username" required autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             placeholder="Enter your password" required />

      <button class="btn" type="submit" id="submitBtn">Sign In</button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const form = new FormData(e.target);
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          body: form,
          credentials: 'include',
        });
        if (r.ok) {
          // Redirect to dashboard (or the page they were trying to reach)
          const next = new URLSearchParams(window.location.search).get('next') || '/';
          window.location.href = next;
        } else {
          const data = await r.json().catch(() => ({}));
          errorBox.textContent = data.detail || 'Invalid username or password.';
          errorBox.style.display = 'block';
        }
      } catch {
        errorBox.textContent = 'Network error — could not reach Veritas server.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
