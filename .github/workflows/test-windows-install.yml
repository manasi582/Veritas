name: Test Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test-windows:
    name: Install & smoke-test veritas on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the CI test license key (never the production key)
        run: python .github/scripts/use_ci_license_key.py

      - name: Get latest release tag
        id: tag
        shell: bash
        run: |
          git fetch --tags --force
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.12")
          VER=${TAG#v}
          echo "Using release: $TAG (version $VER)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER"  >> $GITHUB_OUTPUT

      - name: Disable Windows Defender real-time scanning (speeds up large installer)
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Write-Host "Defender real-time monitoring disabled"

      - name: Install Python dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build veritas-runtime.exe (PyInstaller)
        working-directory: dpdpa-agent
        run: python -m PyInstaller veritas.spec --noconfirm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build veritas-launcher.exe (Go)
        working-directory: veritas-launcher
        run: go build -ldflags="-s -w" -o ..\dpdpa-agent\dist\veritas-launcher.exe .

      - name: Install built binaries to Program Files
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Veritas"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "dpdpa-agent\dist\veritas-runtime.exe"  "$dir\veritas-runtime.exe"
          Copy-Item "dpdpa-agent\dist\veritas-launcher.exe" "$dir\veritas-launcher.exe"
          Write-Host "RUNTIME_EXE:  $(Test-Path "$dir\veritas-runtime.exe")"
          Write-Host "LAUNCHER_EXE: $(Test-Path "$dir\veritas-launcher.exe")"

      - name: Register Windows Service
        shell: pwsh
        run: |
          Write-Host "Registering VeritasService..."
          & "C:\Program Files\Veritas\veritas-launcher.exe" install 2>&1
          $svc = Get-Service "Veritas" -ErrorAction SilentlyContinue
          Write-Host "SERVICE_REGISTERED: $($null -ne $svc)"
          if (-not $svc) { throw "Service registration failed" }

      - name: Generate CI test license (any-machine)
        shell: pwsh
        env:
          VERITAS_CI_PRIVATE_KEY_B64: ${{ secrets.VERITAS_CI_PRIVATE_KEY_B64 }}
        run: |
          pip install cryptography --quiet
          # Decode private key from secret
          $keyBytes = [Convert]::FromBase64String($env:VERITAS_CI_PRIVATE_KEY_B64)
          [System.IO.File]::WriteAllBytes("C:\ci_private_key.pem", $keyBytes)
          python tools/generate_license.py `
            --org "ci-windows-test" `
            --tier enterprise `
            --expiry 2027-12-31 `
            --key "C:\ci_private_key.pem" `
            --out "C:\ci-win.vlic"
          Write-Host "License generated: $(Test-Path 'C:\ci-win.vlic')"
          Remove-Item "C:\ci_private_key.pem" -Force

      - name: Install license
        shell: pwsh
        run: |
          $dir = "C:\Program Files\Veritas"
          Copy-Item "C:\ci-win.vlic" "$dir\veritas.vlic"
          Write-Host "License installed: $(Test-Path "$dir\veritas.vlic")"

      - name: Run Veritas directly (foreground, captures all output)
        shell: pwsh
        run: |
          Write-Host "Starting veritas-launcher.exe run (foreground, 4 min timeout)..."
          # Run directly to capture stdout/stderr — shows exactly what happens
          $job = Start-Job -ScriptBlock {
            $env:VERITAS_DATA_DIR = "C:\Program Files\Veritas"
            & "C:\Program Files\Veritas\veritas-launcher.exe" run 2>&1
          }

          # Server starts in ~5-10s on Windows (TLS cert gen + spaCy warm)
          Start-Sleep -Seconds 30
          $started = $false
          for ($i = 1; $i -le 15; $i++) {
            Start-Sleep -Seconds 10
            try {
              $r = Invoke-WebRequest "https://localhost:8000/health" -UseBasicParsing -TimeoutSec 8 -SkipCertificateCheck
              Write-Host "HEALTH_HTTP: $($r.StatusCode)"
              Write-Host "HEALTH_BODY: $($r.Content)"
              $started = $true
              break
            } catch {
              Write-Host "  attempt $i/20 ($($i*15)s) — $($_.Exception.Message)"
            }
          }

          # Get launcher output regardless
          $output = Receive-Job $job 2>&1
          Write-Host "=== LAUNCHER OUTPUT ==="
          Write-Host $output
          Write-Host "=== END OUTPUT ==="

          if (-not $started) { throw "Health endpoint did not respond after 5 min" }

      - name: Check setup page
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest "https://localhost:8000/setup" -UseBasicParsing -TimeoutSec 10 -SkipCertificateCheck
            Write-Host "SETUP_HTTP: $($r.StatusCode)"
          } catch {
            Write-Host "SETUP_HTTP: $($_.Exception.Response.StatusCode.value__)"
          }

      - name: Print summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "  Veritas Windows Install Test COMPLETE"
          Write-Host "================================================"
          Get-Service "Veritas" -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Program Files\Veritas\" | Select-Object Name, Length
