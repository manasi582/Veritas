name: Load test

# How fast does one Veritas server take events from many agents, and does it lose any? Runs the
# server from this commit on a GitHub runner (2 vCPUs: a small machine, so read the numbers as a
# floor), sends events from 1, 5, 20 and 50 simulated agents, and writes a table to the run summary.
# Start it by hand (Actions, Load test, Run workflow) before a release or after changing detection,
# the evidence store or the event API.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds each load level runs"
        default: "20"
      levels:
        description: "Agent counts to try, space separated"
        default: "1 5 20 50"
      workers:
        description: "VERITAS_DETECTION_WORKERS: detection worker processes (0 = one thread, the original behaviour)"
        default: "2"
      ratios:
        description: "Share of lines holding personal data to try, space separated (0 = none, 1 = all)"
        default: "0 0.3 1"

jobs:
  load:
    name: Send events from many agents
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      VERITAS_DETECTION_WORKERS: ${{ inputs.workers }}
      VERITAS_URL: https://localhost:8000
      VERITAS_ADMIN_USER: ci_admin
      VERITAS_ADMIN_PASSWORD: CiAdmin#12345
      VERITAS_ORG: ci_org
      VERITAS_SETUP_CODE: ci-setup-code

    steps:
      - uses: actions/checkout@v4

      - name: Trust the CI test license key (never the production key)
        run: python3 .github/scripts/use_ci_license_key.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dpdpa-agent/requirements.txt

      - name: Install the server
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl
          pip install psutil

      - name: Create an any-machine test license
        env:
          VERITAS_CI_PRIVATE_KEY_B64: ${{ secrets.VERITAS_CI_PRIVATE_KEY_B64 }}
        run: |
          test -n "$VERITAS_CI_PRIVATE_KEY_B64" || { echo "VERITAS_CI_PRIVATE_KEY_B64 secret is not set"; exit 1; }
          mkdir -p /tmp/vdata
          echo "$VERITAS_CI_PRIVATE_KEY_B64" | base64 -d > /tmp/ci_private_key.pem
          chmod 600 /tmp/ci_private_key.pem
          python tools/generate_license.py --org ci-load-test --tier enterprise \
            --expiry 2027-12-31 --key /tmp/ci_private_key.pem --out /tmp/vdata/veritas.vlic
          rm -f /tmp/ci_private_key.pem

      - name: Start the server and create the administrator
        run: |
          source .github/scripts/agent_ci_lib.sh
          start_server
          wait_server
          python .github/scripts/agent_e2e.py setup

      - name: Sample the server's memory and CPU while the test runs
        run: |
          nohup python3 - <<'PY' > /tmp/resources.log 2>&1 &
          import json, time, psutil
          pid = [p for p in psutil.process_iter(["cmdline"]) if p.info["cmdline"] and "run_pipeline.py" in " ".join(p.info["cmdline"])][0].pid
          proc = psutil.Process(pid)
          proc.cpu_percent(None)
          peak_rss = 0; peak_cpu = 0
          while True:
              time.sleep(2)
              try:
                  rss = proc.memory_info().rss + sum(c.memory_info().rss for c in proc.children(recursive=True))
                  cpu = proc.cpu_percent(None)
              except psutil.Error:
                  break
              peak_rss = max(peak_rss, rss); peak_cpu = max(peak_cpu, cpu)
              open("/tmp/resources.json", "w").write(json.dumps({"peak_rss_mb": round(peak_rss / 1e6), "peak_cpu_percent": peak_cpu}))
          PY
          sleep 3

      - name: Run each load level
        run: |
          mkdir -p /tmp/load
          for ratio in ${{ inputs.ratios }}; do
            for n in ${{ inputs.levels }}; do
              echo "::group::$n agents, $ratio of lines with personal data"
              python tools/loadtest.py --url "$VERITAS_URL" --agents "$n" --duration "${{ inputs.seconds }}" \
                --pii-ratio "$ratio" --max-error-rate 0.0 --out "/tmp/load/r${ratio}_agents_$n.json" || echo "level $n / $ratio reported problems"
              echo "::endgroup::"
            done
          done

      - name: Write the result table
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          rows = sorted((json.load(open(f)) for f in glob.glob("/tmp/load/*.json")), key=lambda r: (r["pii_ratio"], r["agents"]))
          print("## Load test\n")
          import os
          print(f"GitHub runner, 2 vCPUs, detection workers: {os.environ.get('VERITAS_DETECTION_WORKERS')}. Latency is the time for one event to be accepted.\n")
          print("| Lines with personal data | Agents | Events/s | p50 ms | p95 ms | p99 ms | Failed | Findings expected/stored | Chain valid |")
          print("|---|---|---|---|---|---|---|---|---|")
          for r in rows:
              l = r["latency_ms"]
              print(f'| {int(r["pii_ratio"] * 100)}% | {r["agents"]} | {r["throughput_events_per_second"]} | {l["p50"]} | {l["p95"]} | {l["p99"]} | {r["events_failed"]} | {r["findings_expected"]}/{r["findings_stored"]} | {r["evidence_chain_valid"]} |')
          try:
              res = json.load(open("/tmp/resources.json"))
              print(f'\nServer peak memory {res["peak_rss_mb"]} MB, peak CPU {res["peak_cpu_percent"]}% of one core.')
          except Exception:
              pass
          PY

      - name: Attach the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: /tmp/load
          if-no-files-found: ignore

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/server.log || true

      - name: Remove secrets
        if: always()
        run: rm -f /tmp/ci_private_key.pem /tmp/vdata/veritas.vlic
