name: Release — Build & Publish Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Gate: a known-vulnerable dependency blocks the release ─────────────
  dependency-audit:
    name: Dependencies have no known vulnerabilities
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash .github/scripts/audit.sh dpdpa-agent/requirements.txt veritas-agent/requirements.txt
      - name: The release trusts only the production license key
        run: python3 .github/scripts/check_release_key.py

  # ── Linux .deb ─────────────────────────────────────────────────────────
  build-linux-deb:
    name: Linux .deb (Ubuntu 22.04 amd64)
    needs: dependency-audit
    runs-on: ubuntu-22.04   # pin to 22.04 so binary links against GLIBC 2.35 (max compat)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Software bill of materials (every package inside the server)
        run: |
          python -m venv /tmp/sbomtool && /tmp/sbomtool/bin/pip install -q cyclonedx-bom
          /tmp/sbomtool/bin/cyclonedx-py environment --of JSON -o "dist-sbom-server.cdx.json" "$(which python)"
          python -c "import json; d=json.load(open('dist-sbom-server.cdx.json')); print(len(d['components']), 'components')"
          mkdir -p dist && mv dist-sbom-server.cdx.json "dist/veritas-server_${GITHUB_REF_NAME#v}.sbom.cdx.json"

      - name: Verify presidio conf is accessible
        working-directory: dpdpa-agent
        run: |
          python3 -c "
          import pathlib, presidio_analyzer
          from PyInstaller.utils.hooks import collect_data_files
          pa_dir = pathlib.Path(presidio_analyzer.__file__).parent
          conf = pa_dir / 'conf'
          print(f'presidio_analyzer path: {pa_dir}')
          print(f'conf dir exists: {conf.exists()}')
          if conf.exists():
              print(f'conf files: {list(conf.iterdir())}')
          datas = collect_data_files('presidio_analyzer')
          conf_datas = [d for d in datas if 'conf' in str(d[0])]
          print(f'collect_data_files found conf entries: {conf_datas[:3]}')
          "

      - name: Build PyInstaller binary
        working-directory: dpdpa-agent
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION     # the server reports this release version
          python -m PyInstaller veritas-linux.spec --noconfirm

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x package/build-deb.sh
          bash package/build-deb.sh dpdpa-agent/dist/veritas-runtime $VERSION amd64

      - name: Upload .deb artifact (for release-notes job)
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/veritas_*.deb
          retention-days: 1

      - name: Upload .deb and software bill of materials to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/veritas_*.deb
            dist/veritas-server_*.sbom.cdx.json

  # ── macOS .pkg ────────────────────────────────────────────────────────
  build-macos-pkg:
    name: macOS .pkg (Apple Silicon arm64)
    needs: dependency-audit
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build PyInstaller binary
        working-directory: dpdpa-agent
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION     # the server reports this release version
          python -m PyInstaller veritas-mac.spec --noconfirm

      - name: Build .pkg installer
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x package/macos/build-pkg.sh
          bash package/macos/build-pkg.sh dpdpa-agent/dist/veritas-runtime $VERSION arm64

      - name: Upload .pkg artifact (for release-notes job)
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/veritas_*.pkg
          retention-days: 1

      - name: Upload .pkg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veritas_*.pkg

  # ── macOS agent .pkg ──────────────────────────────────────────────────
  build-macos-agent-pkg:
    name: macOS agent .pkg (Apple Silicon arm64)
    needs: dependency-audit
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the agent binary
        working-directory: veritas-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          echo "${GITHUB_REF_NAME#v}" > VERSION     # the agent reports this release version
          python -m PyInstaller veritas-agent-mac.spec --noconfirm

      - name: Build the agent .pkg
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          bash package/macos/build-agent-pkg.sh veritas-agent/dist/veritas-agent-runtime $VERSION arm64

      - name: Upload agent .pkg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veritas-agent_*.pkg

  # ── Windows .exe installer ────────────────────────────────────────────
  build-windows-exe:
    name: Windows installer (amd64)
    needs: dependency-audit
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build PyInstaller runtime
        working-directory: dpdpa-agent
        shell: bash
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION     # the server reports this release version
          python -m PyInstaller veritas.spec --noconfirm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go launcher
        working-directory: veritas-launcher
        run: |
          go build -ldflags="-s -w" -o ../dpdpa-agent/dist/veritas-launcher.exe .

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force installer/output | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$VERSION" "installer\veritas-installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/veritas_*_windows_amd64.exe

  # ── Agent .deb (lightweight — no PyInstaller) ─────────────────────────
  build-agent-deb:
    name: Agent .deb (all architectures)
    needs: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build veritas-agent .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          chmod +x package/build-agent-deb.sh
          bash package/build-agent-deb.sh $VERSION all

      - name: Upload agent .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/veritas-agent_*.deb

  # ── Agent container image (GitHub Container Registry) ─────────────────
  build-agent-image:
    name: Agent container image (ghcr.io, amd64 + arm64)
    needs: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name and version
        run: |
          echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # registry names must be lower case
          echo "IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/veritas-agent" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: veritas-agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VER }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VER }}
            ${{ env.IMAGE }}:latest

  # ── Kubernetes manifests with the image pinned to this release ───────
  publish-k8s-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Render the manifests with the release image
        run: |
          VER=${GITHUB_REF_NAME#v}
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          cd veritas-agent/k8s
          kubectl kustomize . | sed "s#ghcr.io/[A-Za-z0-9_.-]*/veritas-agent:latest#ghcr.io/${OWNER}/veritas-agent:${VER}#" \
            > ../../veritas-agent-k8s_${VER}.yaml
          grep -q "veritas-agent:${VER}" ../../veritas-agent-k8s_${VER}.yaml

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: veritas-agent-k8s_*.yaml

  # ── Checksums and a signature, so a download can be checked ──────────
  publish-integrity:
    name: Checksums and signature
    runs-on: ubuntu-22.04
    needs: [build-linux-deb, build-macos-pkg, build-macos-agent-pkg, build-windows-exe, build-agent-deb, publish-k8s-manifests]
    permissions:
      contents: write
      id-token: write       # lets the workflow sign with its own identity (no key to keep or leak)
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Collect the release files and checksum them
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern '*.pkg' --pattern '*.exe' --pattern '*.yaml' --pattern '*.sbom.cdx.json'
          ls -l
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Sign the checksum file
        working-directory: assets
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Check the signature the way a customer would
        working-directory: assets
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/SHA256SUMS
            assets/SHA256SUMS.sigstore.json

  # ── Release notes ─────────────────────────────────────────────────────
  publish-release-notes:
    name: Publish release notes with install instructions
    runs-on: ubuntu-latest
    needs: [build-linux-deb, build-macos-pkg, build-macos-agent-pkg, build-windows-exe, build-agent-deb, build-agent-image, publish-k8s-manifests, publish-integrity]
    permissions:
      contents: write
    steps:
      - name: Strip v-prefix from tag for filenames
        run: echo "VER=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: What's new (from CHANGELOG.md)
        id: changelog
        run: |
          # the section for this release; a release with no entry yet gets a pointer to the file
          notes=$(awk -v v="$VER" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          [ -n "$notes" ] || notes="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          { echo "notes<<CHANGELOG_EOF"; echo "$notes"; echo "CHANGELOG_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Update release with install instructions
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Veritas DPDPA Compliance Platform ${{ github.ref_name }}

            ### What's new

            ${{ steps.changelog.outputs.notes }}

            ### Quick Install

            **Linux (Ubuntu 22.04+ / Debian 11+):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/shreyaaassss/Veritas/main/install.sh | sudo bash
            ```
            Or manually:
            ```bash
            wget https://github.com/shreyaaassss/Veritas/releases/download/${{ github.ref_name }}/veritas_${{ env.VER }}_amd64.deb
            sudo dpkg -i veritas_${{ env.VER }}_amd64.deb
            sudo systemctl start veritas
            ```

            **Windows (amd64):**
            ```
            Download veritas_${{ env.VER }}_windows_amd64.exe and run as Administrator
            ```
            The installer prompts for your `.vlic` license file during setup.

            **macOS (Apple Silicon):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/shreyaaassss/Veritas/main/install.sh | sudo bash
            ```
            Or download `veritas_${{ env.VER }}_arm64.pkg` from the assets below and double-click.

            ### After Installation (Server)

            1. `sudo veritas fingerprint` — send the output to your Veritas contact
            2. `sudo veritas license /path/to/veritas.vlic` — install license
            3. `sudo veritas start` — start the server
            4. Open https://localhost:8000/setup (self-signed certificate) and create the admin account. It asks for a one-time setup code: `sudo veritas setup-code`

            CLI: `veritas {start|stop|restart|status|logs|fingerprint|license|check}`

            ### Agent Install (on each monitored server)

            ```bash
            wget https://github.com/shreyaaassss/Veritas/releases/download/${{ github.ref_name }}/veritas-agent_${{ env.VER }}_all.deb
            sudo dpkg -i veritas-agent_${{ env.VER }}_all.deb
            sudo veritas-agent fetch-cert https://your-veritas-server:8000
            sudo nano /etc/veritas-agent/config.yaml   # set veritas_address, registration_key and the sources to read
            sudo veritas-agent start
            ```

            **macOS agent (Apple Silicon, no Python needed):**
            ```bash
            curl -LO https://github.com/shreyaaassss/Veritas/releases/download/${{ github.ref_name }}/veritas-agent_${{ env.VER }}_arm64.pkg
            sudo installer -pkg veritas-agent_${{ env.VER }}_arm64.pkg -target /
            sudo nano /etc/veritas-agent/config.yaml   # set veritas_address, registration_key and the sources to read
            sudo veritas-agent grant-read /path/to/a/log/file   # for each file the agent should read
            sudo veritas-agent start
            ```

            Get a registration key from the Veritas dashboard → **Agents** tab → **Issue Registration Key**.

            ### Kubernetes (one agent per node, no change to your applications)

            Image: `ghcr.io/shreyaaassss/veritas-agent:${{ env.VER }}` · Manifests: `veritas-agent-k8s_${{ env.VER }}.yaml` (attached below).
            See `veritas-agent/k8s/README.md` for the steps: create a **reusable** key in the dashboard (Agents → Issue Registration Key → *Many agents*), store it as a Secret, set the server address and the naming rules in the ConfigMap, then apply.

            ### Check your download

            Every file is listed in `SHA256SUMS`, which is signed by this repository's release workflow (no key to trust or lose). `SHA256SUMS.sigstore.json` is the signature.
            ```bash
            sha256sum -c --ignore-missing SHA256SUMS        # Mac: shasum -a 256 -c --ignore-missing SHA256SUMS
            cosign verify-blob --bundle SHA256SUMS.sigstore.json \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
            ```
            `veritas-server_*.sbom.cdx.json` lists every software package inside the server (CycloneDX format).

            ### Requirements

            - **Server**: Ubuntu 22.04+ / Debian 11+ or macOS 12+, systemd, 2 GB RAM, 1 GB disk
            - **Agent**: Ubuntu 18.04+ (python3, python3-requests, python3-yaml auto-installed) or macOS 12+ on Apple Silicon (self-contained)
          append_body: false
