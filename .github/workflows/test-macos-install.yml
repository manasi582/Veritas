name: Test macOS .pkg Installation

# Builds the macOS runtime and the .pkg from the current commit (the same way the release does,
# so there is nothing to wait for), installs it on a clean Apple Silicon runner and exercises the
# whole product: version, fingerprint, license binding, setup code, the dashboard in a browser,
# a real agent, restart, lost-password reset, a company certificate, reinstall keeping the data,
# and uninstall.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'dpdpa-agent/**'
      - 'package/macos/**'
      - 'veritas-agent/**'
      - 'tools/**'
      - '.github/scripts/**'
      - '.github/workflows/test-macos-install.yml'
  workflow_dispatch:

jobs:
  test-macos-pkg:
    name: Build, install and exercise the .pkg on macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      VERITAS_URL: https://localhost:8000
      VERITAS_ORG: smoke_org
      VERITAS_ADMIN_USER: smoke_admin
      VERITAS_ADMIN_PASSWORD: Violet-Harbor#2468
      PKG_VERSION: 0.0.0-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dpdpa-agent/requirements.txt

      # ── Build exactly what the release builds ─────────────────────────────
      - name: Install build dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build the runtime
        working-directory: dpdpa-agent
        run: |
          echo "$PKG_VERSION" > VERSION
          python -m PyInstaller veritas-mac.spec --noconfirm

      - name: Build the .pkg
        run: |
          bash package/macos/build-pkg.sh dpdpa-agent/dist/veritas-runtime "$PKG_VERSION" arm64
          ls -lh dist/

      # ── Install ──────────────────────────────────────────────────────────
      - name: Install the .pkg from the command line
        run: sudo installer -pkg "dist/veritas_${PKG_VERSION}_arm64.pkg" -target /

      - name: Package layout, version and command
        run: |
          if [ "$(veritas version)" != "Veritas $PKG_VERSION" ]; then echo "wrong version: $(veritas version)"; exit 1; fi
          if [ "$(cat /opt/veritas/VERSION)" != "$PKG_VERSION" ]; then echo "VERSION file wrong"; exit 1; fi
          for need in /opt/veritas/veritas-runtime /Library/LaunchDaemons/com.veritas.daemon.plist; do
            if [ ! -e "$need" ]; then echo "missing after install: $need"; exit 1; fi
          done
          id _veritas
          # there is no license yet, so the service must have stopped by itself, once
          sleep 8
          STATE=$(sudo launchctl print system/com.veritas.daemon 2>&1 || true)
          if grep -q "state = running" <<<"$STATE"; then echo "service is running without a license"; echo "$STATE" | head -30; exit 1; fi
          veritas status || true
          for cmd in check fingerprint setup-code license backup restore verify-backup reset-password install-cert trust-cert uninstall; do
            veritas 2>&1 | grep -q "  $cmd" || { echo "veritas help does not list: $cmd"; exit 1; }
          done

      # ── Fingerprint and license binding ──────────────────────────────────
      - name: Fingerprint is v2, stable and the same in the command and the runtime
        run: |
          FP1=$(veritas fingerprint | grep '^v2:')
          FP2=$(veritas fingerprint | grep '^v2:')
          RT=$(VERITAS_DATA_DIR=/var/lib/veritas /opt/veritas/veritas-runtime --fingerprint)
          echo "command: $FP1"; echo "runtime: $RT"
          if [ -z "$FP1" ] || [ "$FP1" != "$FP2" ] || [ "$FP1" != "$RT" ]; then echo "fingerprints differ or are empty"; exit 1; fi
          echo "$FP1" > /tmp/ci_fingerprint
          # hostname changes must not change it
          ORIG=$(scutil --get HostName 2>/dev/null || hostname)
          sudo scutil --set HostName "renamed-by-ci.local"
          AFTER=$(veritas fingerprint | grep '^v2:')
          if [ -n "$ORIG" ]; then sudo scutil --set HostName "$ORIG"; fi
          if [ "$AFTER" != "$FP1" ]; then echo "the fingerprint changed with the host name"; exit 1; fi

      - name: Create licenses (one for another machine, one for this machine)
        env:
          VERITAS_PRIVATE_KEY_B64: ${{ secrets.VERITAS_PRIVATE_KEY_B64 }}
        run: |
          test -n "$VERITAS_PRIVATE_KEY_B64" || { echo "VERITAS_PRIVATE_KEY_B64 secret is not set"; exit 1; }
          python3 -m venv /tmp/licvenv
          /tmp/licvenv/bin/pip install cryptography --quiet
          echo "$VERITAS_PRIVATE_KEY_B64" | base64 -d > /tmp/ci_private_key.pem
          chmod 600 /tmp/ci_private_key.pem
          /tmp/licvenv/bin/python3 tools/generate_license.py --org ci-macos --tier enterprise --expiry 2027-12-31 \
            --fingerprint "v2:$(printf '%064d' 0)" --key /tmp/ci_private_key.pem --out /tmp/other-machine.vlic
          /tmp/licvenv/bin/python3 tools/generate_license.py --org ci-macos --tier enterprise --expiry 2027-12-31 \
            --fingerprint "$(cat /tmp/ci_fingerprint)" --key /tmp/ci_private_key.pem --out /tmp/this-machine.vlic
          rm -f /tmp/ci_private_key.pem

      - name: A license for another machine is refused, with the reason
        run: |
          if sudo veritas license /tmp/other-machine.vlic; then echo "a license for another machine was accepted"; exit 1; fi
          sudo sh -c 'grep -q "not valid for this machine" /var/log/veritas/*.log' \
            || { echo "no clear reason in the logs"; sudo sh -c 'tail -30 /var/log/veritas/*.log'; exit 1; }

      - name: The license for this machine starts the service
        run: |
          sudo veritas license /tmp/this-machine.vlic
          for i in $(seq 1 60); do
            curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && { echo "up after about $((i*5))s"; exit 0; }
            sleep 5
          done
          echo "server did not start"; sudo sh -c 'tail -40 /var/log/veritas/*.log'; exit 1

      - name: Health, status and the check command
        run: |
          veritas status
          sudo veritas check || true     # warnings are fine; the report is in the log
          curl -sk "$VERITAS_URL/api/version"

      - name: Files are private and the program belongs to root
        run: |
          # logs hold the setup code and operational detail: not readable by other users
          for f in /var/log/veritas/veritas.log /var/log/veritas/veritas-error.log; do
            mode=$(sudo stat -f '%Lp' "$f")
            case "$mode" in *00) ;; *) echo "$f is readable by other users (mode $mode)"; exit 1;; esac
          done
          # the service must not be able to replace its own program
          test "$(stat -f '%Su' /opt/veritas/veritas-runtime)" = "root" || { echo "program not owned by root"; ls -l /opt/veritas; exit 1; }
          # without sudo the setup code is refused with the reason, not "there is no code"
          if out=$(veritas setup-code 2>&1); then echo "setup-code worked without sudo"; exit 1; fi
          echo "$out" | grep -q "sudo" || { echo "no hint to use sudo: $out"; exit 1; }

      - name: The server keeps its own log, which it rotates itself
        run: |
          # launchd keeps writing to a file that was rotated from outside, so the server rotates
          # veritas-app.log itself (the size limit and compression are unit-tested)
          f=/var/log/veritas/veritas-app.log
          sudo test -s "$f" || { echo "no server log"; sudo ls -l /var/log/veritas; exit 1; }
          test "$(sudo stat -f '%Su %Lp' "$f")" = "_veritas 600" || { echo "wrong owner or mode: $(sudo stat -f '%Su %Lp' "$f")"; exit 1; }
          sudo grep -q "Dashboard:" "$f" || { echo "start-up line missing"; sudo tail -20 "$f"; exit 1; }
          grep -q 'APPLOG' /usr/local/bin/veritas || { echo "veritas logs does not follow the server log"; exit 1; }

      # ── The dashboard in a real browser (setup, org, key, violation, users...) ─
      - name: Install the browser driver
        run: |
          pip install playwright requests pyyaml
          python -m playwright install chromium

      - name: Drive the dashboard
        run: |
          export VERITAS_SETUP_CODE=$(sudo veritas setup-code | grep -E '^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$')
          test -n "$VERITAS_SETUP_CODE" || { echo "no setup code"; exit 1; }
          python .github/scripts/browser_smoke.py

      # ── A real agent ─────────────────────────────────────────────────────
      - name: A real agent forwards a log line
        run: |
          export PYTHONUNBUFFERED=1
          KEY=$(python .github/scripts/agent_e2e.py issue-key)
          mkdir -p /tmp/agent-state && touch /tmp/ci-agent.log
          cat > /tmp/agent-config.yaml <<CFG
          veritas_address: ${VERITAS_URL}
          registration_key: "${KEY}"
          source_label: macos-ci-agent
          tls:
            verify: false
          sources:
            - type: file
              path: /tmp/ci-agent.log
              source_system: kyc-service
          CFG
          VERITAS_STATE_DIR=/tmp/agent-state VERITAS_AGENT_VERSION=0.0.0-ci \
            nohup python veritas-agent/agent.py --config /tmp/agent-config.yaml > /tmp/agent.log 2>&1 &
          python .github/scripts/agent_e2e.py wait-agent --label macos-ci-agent --version 0.0.0-ci --timeout 120
          BEFORE=$(python .github/scripts/agent_e2e.py count --source-system kyc-service)
          echo "DEBUG customer verified with Aadhaar 2345 6789 0124" >> /tmp/ci-agent.log
          python .github/scripts/agent_e2e.py violations --min $((BEFORE + 1)) --source-system kyc-service --timeout 120
          python .github/scripts/agent_e2e.py verify-chain

      # ── Restart keeps the data ───────────────────────────────────────────
      - name: Restart keeps the data and the evidence chain
        run: |
          BEFORE=$(python .github/scripts/agent_e2e.py count --source-system kyc-service)
          sudo veritas restart
          for i in $(seq 1 60); do
            curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && break
            sleep 5
          done
          AFTER=$(python .github/scripts/agent_e2e.py count --source-system kyc-service)
          [ "$BEFORE" = "$AFTER" ] || { echo "violations before=$BEFORE after=$AFTER"; exit 1; }
          python .github/scripts/agent_e2e.py verify-chain

      # ── Company certificate ──────────────────────────────────────────────
      - name: Install a company certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=ci-company-cert" \
            -addext "subjectAltName=DNS:ci-company-cert,DNS:localhost" -keyout /tmp/t.key -out /tmp/t.crt 2>/dev/null
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=other" -keyout /tmp/o.key -out /tmp/o.crt 2>/dev/null
          if sudo veritas install-cert /tmp/t.crt /tmp/o.key; then echo "a mismatched key was accepted"; exit 1; fi
          sudo veritas install-cert /tmp/t.crt /tmp/t.key
          for i in $(seq 1 60); do
            curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && break
            sleep 5
          done
          SUBJECT=$(echo | openssl s_client -connect localhost:8000 2>/dev/null | openssl x509 -noout -subject)
          echo "$SUBJECT"
          grep -q "ci-company-cert" <<<"$SUBJECT" || { echo "the new certificate is not being served"; exit 1; }
          sudo ls /var/lib/veritas/certs | grep -q 'server.crt\.' || { echo "the previous certificate was not kept"; exit 1; }

      - name: "trust-cert (informational, macOS may ask for an interactive approval)"
        continue-on-error: true
        run: sudo veritas trust-cert

      # ── Lost administrator password ──────────────────────────────────────
      - name: Reset a lost administrator password from the command line
        run: |
          OUT=$(sudo veritas reset-password "$VERITAS_ADMIN_USER")
          TEMP=$(sed -n 's/^Temporary password for [^:]*: //p' <<<"$OUT" | awk '{print $1}')
          test -n "$TEMP" || { echo "no temporary password printed"; echo "$OUT"; exit 1; }
          # the old password no longer works, the temporary one does and must be changed
          OLD=$(curl -sk -o /dev/null -w '%{http_code}' -X POST "$VERITAS_URL/api/auth/login" -d "username=$VERITAS_ADMIN_USER" --data-urlencode "password=$VERITAS_ADMIN_PASSWORD")
          [ "$OLD" = "401" ] || { echo "the old password still works ($OLD)"; exit 1; }
          curl -sk -X POST "$VERITAS_URL/api/auth/login" -d "username=$VERITAS_ADMIN_USER" --data-urlencode "password=$TEMP" | grep -q '"must_change_password":true' \
            || { echo "temporary password did not work or does not force a change"; exit 1; }

      # ── Backup and restore ───────────────────────────────────────────────
      - name: Backup, verify, change something, restore
        run: |
          OUT=$(sudo veritas backup); echo "$OUT"
          BK=$(sed -n 's/^Backup created: //p' <<<"$OUT")
          test -n "$BK" || { echo "no backup path printed"; exit 1; }
          sudo veritas backups | grep -q "$(basename "$BK")" || { echo "backup not listed"; exit 1; }
          sudo veritas verify-backup "$BK" | grep -q "VERIFIED OK"
          # the bare name printed by `veritas backups` works as well as the full path
          sudo veritas verify-backup "$(basename "$BK")" | grep -q "VERIFIED OK"
          # a backup in a private folder is still readable by the command
          sudo mkdir -p /var/root/bk && sudo cp "$BK" /var/root/bk/private.zip
          sudo veritas verify-backup /var/root/bk/private.zip | grep -q "VERIFIED OK"
          # change the user database after the backup: a new temporary password for the administrator
          OUT2=$(sudo veritas reset-password "$VERITAS_ADMIN_USER")
          TEMP2=$(sed -n 's/^Temporary password for [^:]*: //p' <<<"$OUT2" | awk '{print $1}')
          test -n "$TEMP2" || { echo "no temporary password"; exit 1; }
          login() { curl -sk -o /dev/null -w '%{http_code}' -X POST "$VERITAS_URL/api/auth/login" -d "username=$VERITAS_ADMIN_USER" --data-urlencode "password=$1"; }
          [ "$(login "$TEMP2")" = "200" ] || { echo "temporary password does not work before the restore"; exit 1; }
          echo marker | sudo tee /var/lib/veritas/certs/added-after-backup.pem >/dev/null
          # a dry run changes nothing
          sudo veritas restore "$BK" --dry-run | grep -q "DRY RUN OK"
          [ "$(login "$TEMP2")" = "200" ] || { echo "the dry run changed data"; exit 1; }
          # the real restore: service stopped, data restored, service started again
          sudo veritas restore "$BK" | tee /tmp/restore.out
          grep -q "Restore complete. Veritas is running." /tmp/restore.out || { echo "restore did not wait for the server"; exit 1; }
          if sudo test -e /var/lib/veritas/certs/added-after-backup.pem; then echo "restore left a file that was not in the backup"; exit 1; fi
          sudo ls /var/lib/veritas/backups | grep -q '^pre-restore-' || { echo "no safety copy of the replaced data"; exit 1; }
          test "$(sudo stat -f '%Su' /var/lib/veritas/users.db)" = "_veritas" || { echo "restored files are not owned by the service account"; exit 1; }
          for i in $(seq 1 60); do
            curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && break
            sleep 5
          done
          curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' || { echo "server did not come back after the restore"; sudo tail -40 /var/log/veritas/veritas-error.log; exit 1; }
          # the user database is back to the state of the backup: the later temporary password is gone
          [ "$(login "$TEMP2")" = "401" ] || { echo "the restore did not bring back the earlier user data"; exit 1; }
          # the license was kept
          sudo test -e /var/lib/veritas/veritas.vlic
          # a damaged file is refused and the service keeps running
          echo junk > /tmp/junk.zip
          if sudo veritas restore /tmp/junk.zip; then echo "a corrupt backup was accepted"; exit 1; fi
          curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' || { echo "service not running after a refused restore"; exit 1; }

      # ── Reinstall keeps the data, uninstall removes everything ───────────
      - name: Uninstall keeps the data, reinstall finds it and starts
        run: |
          sudo veritas uninstall
          for gone in /opt/veritas /Library/LaunchDaemons/com.veritas.daemon.plist /usr/local/bin/veritas; do
            if [ -e "$gone" ]; then echo "left behind after uninstall: $gone"; exit 1; fi
          done
          for kept in /var/lib/veritas/veritas.vlic /var/lib/veritas/evidence.db; do
            if ! sudo test -e "$kept"; then echo "data was removed by a plain uninstall: $kept"; exit 1; fi
          done
          sudo installer -pkg "dist/veritas_${PKG_VERSION}_arm64.pkg" -target /
          for i in $(seq 1 60); do
            curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && { echo "up after reinstall"; exit 0; }
            sleep 5
          done
          echo "no start after reinstall"; sudo tail -40 /var/log/veritas/veritas-error.log; exit 1

      - name: Uninstall with --purge-data removes everything
        run: |
          sudo veritas uninstall --purge-data
          for gone in /opt/veritas /var/lib/veritas /var/log/veritas; do
            if [ -e "$gone" ]; then echo "left behind after --purge-data: $gone"; exit 1; fi
          done
          if id _veritas >/dev/null 2>&1; then echo "service user left behind"; exit 1; fi
          if curl -sk --max-time 3 "$VERITAS_URL/health" >/dev/null 2>&1; then echo "server still answering"; exit 1; fi

      # ── Upgrades: from the previous release, and the downgrade guard ─────
      - name: Upgrade from the previous release keeps everything
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_STATE: /tmp/upgrade-state.json
          VERITAS_ORG: upgrade_org
        run: |
          up() { for i in $(seq 1 60); do curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && return 0; sleep 5; done; return 1; }
          PREV=$(gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.draft == false and .tag_name != "'"$GITHUB_REF_NAME"'") | .tag_name][0]')
          test -n "$PREV" || { echo "no previous release found"; exit 1; }
          echo "previous release: $PREV"
          curl -fL --retry 3 -o /tmp/prev.pkg "https://github.com/${{ github.repository }}/releases/download/$PREV/veritas_${PREV#v}_arm64.pkg"
          sudo installer -pkg /tmp/prev.pkg -target /
          rm -f /tmp/prev.pkg
          test "$(veritas version)" = "Veritas ${PREV#v}" || { echo "old release did not install: $(veritas version)"; exit 1; }
          sudo veritas license /tmp/this-machine.vlic
          up || { echo "old release did not start"; sudo tail -40 /var/log/veritas/veritas-error.log; exit 1; }
          export VERITAS_SETUP_CODE=$(sudo veritas setup-code | grep -E '^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$')
          test -n "$VERITAS_SETUP_CODE" || { echo "no setup code"; exit 1; }
          python .github/scripts/upgrade_check.py seed
          BEFORE=$(sudo veritas backups | grep -c veritas-backup || true)
          # install the release built from this commit over it
          OUT=$(sudo installer -pkg "dist/veritas_${PKG_VERSION}_arm64.pkg" -target / 2>&1) || { echo "$OUT"; exit 1; }
          test "$(veritas version)" = "Veritas $PKG_VERSION" || { echo "upgrade did not take: $(veritas version)"; exit 1; }
          up || { echo "new release did not start after the upgrade"; sudo tail -40 /var/log/veritas/veritas-error.log; exit 1; }
          python .github/scripts/upgrade_check.py verify
          AFTER=$(sudo veritas backups | grep -c veritas-backup || true)
          [ "$AFTER" -gt "$BEFORE" ] || { echo "no backup was made before the upgrade ($BEFORE before, $AFTER after)"; exit 1; }
          sudo veritas verify-backup "$(sudo veritas backups | awk 'NR==1{print $1}')" | grep -q "VERIFIED OK"
          sudo veritas uninstall --purge-data

      - name: Downgrade is refused unless asked for, and the data survives
        env:
          UPGRADE_STATE: /tmp/upgrade-state.json
          VERITAS_ORG: upgrade_org
        run: |
          up() { for i in $(seq 1 60); do curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && return 0; sleep 5; done; return 1; }
          # two numeric releases built from the same program
          for v in 9.0.1 9.0.2; do bash package/macos/build-pkg.sh dpdpa-agent/dist/veritas-runtime "$v" arm64 >/dev/null; done
          sudo installer -pkg dist/veritas_9.0.2_arm64.pkg -target /
          sudo veritas license /tmp/this-machine.vlic
          up || { echo "9.0.2 did not start"; exit 1; }
          export VERITAS_SETUP_CODE=$(sudo veritas setup-code | grep -E '^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$')
          python .github/scripts/upgrade_check.py seed
          # an older release over a newer one is refused, and nothing is stopped or changed
          if sudo installer -pkg dist/veritas_9.0.1_arm64.pkg -target / >/tmp/downgrade.out 2>&1; then
            echo "a downgrade was accepted"; cat /tmp/downgrade.out; exit 1
          fi
          test "$(cat /opt/veritas/VERSION)" = "9.0.2" || { echo "the refused downgrade changed the program"; exit 1; }
          curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' || { echo "the refused downgrade stopped the service"; exit 1; }
          # on purpose: the marker file allows exactly one downgrade
          sudo touch /var/lib/veritas/ALLOW_DOWNGRADE
          sudo installer -pkg dist/veritas_9.0.1_arm64.pkg -target /
          test "$(cat /opt/veritas/VERSION)" = "9.0.1" || { echo "the allowed downgrade did not install"; exit 1; }
          if sudo test -e /var/lib/veritas/ALLOW_DOWNGRADE; then echo "the marker was not consumed"; exit 1; fi
          up || { echo "service did not start after the downgrade"; sudo tail -40 /var/log/veritas/veritas-error.log; exit 1; }
          python .github/scripts/upgrade_check.py verify

      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dashboard-screenshots
          path: smoke-shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== launchctl ==="; sudo launchctl print system/com.veritas.daemon 2>&1 | head -40 || true
          echo "=== error log ==="; sudo tail -80 /var/log/veritas/veritas-error.log 2>/dev/null || true
          echo "=== log ==="; sudo tail -60 /var/log/veritas/veritas-app.log /var/log/veritas/veritas.log 2>/dev/null || true
          echo "=== agent ==="; tail -40 /tmp/agent.log 2>/dev/null || true

      - name: Remove secrets
        if: always()
        run: rm -f /tmp/ci_private_key.pem /tmp/*.vlic
