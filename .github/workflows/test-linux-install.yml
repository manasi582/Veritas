name: Test Linux .deb Installation

# Builds the .deb from the current commit (not a published release), installs it
# on a clean Ubuntu runner and exercises the license + service lifecycle.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'package/deb/**'
      - 'package/build-deb.sh'
      - 'dpdpa-agent/license.py'
      - 'dpdpa-agent/run_pipeline.py'
      - 'dpdpa-agent/backup.py'
      - 'dpdpa-agent/schema_guard.py'
      - '.github/scripts/upgrade_check.py'
      - '.github/scripts/check_detection.py'
      - 'dpdpa-agent/detection/**'
      - 'dpdpa-agent/veritas-linux.spec'
      - 'tools/fingerprint.py'
      - 'tools/generate_license.py'
      - '.github/workflows/test-linux-install.yml'
  workflow_dispatch:

jobs:
  test-linux-deb:
    name: Build, install and smoke-test veritas .deb on Ubuntu 22.04
    runs-on: ubuntu-22.04   # same base as the release build
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Trust the CI test license key (never the production key)
        run: python3 .github/scripts/use_ci_license_key.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: dpdpa-agent/requirements.txt

      - name: Install build dependencies
        working-directory: dpdpa-agent
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Build runtime binary
        working-directory: dpdpa-agent
        run: python -m PyInstaller veritas-linux.spec --noconfirm

      - name: Build .deb
        run: |
          chmod +x package/build-deb.sh
          bash package/build-deb.sh dpdpa-agent/dist/veritas-runtime 0.0.0-ci amd64
          ls -lh dist/*.deb

      - name: Install .deb
        run: sudo apt-get install -y ./dist/veritas_0.0.0-ci_amd64.deb

      - name: Package layout, user and service unit
        run: |
          id veritas
          test -x /opt/veritas/veritas-runtime
          test -x /usr/bin/veritas
          systemctl is-enabled veritas
          if systemctl is-active --quiet veritas; then echo "service is running before it has a license"; exit 1; fi
          veritas version

      - name: Fingerprint — CLI equals runtime, v2 format
        run: |
          FP_RT=$(/opt/veritas/veritas-runtime --fingerprint)
          FP_CLI=$(sudo veritas fingerprint | grep -E '^v2:[0-9a-f]{64}$')
          echo "runtime: $FP_RT"
          echo "cli:     $FP_CLI"
          [[ "$FP_RT" =~ ^v2:[0-9a-f]{64}$ ]] || { echo "runtime fingerprint is not v2 format"; exit 1; }
          [ "$FP_RT" = "$FP_CLI" ] || { echo "CLI and runtime fingerprints differ"; exit 1; }
          echo "FP=$FP_RT" >> "$GITHUB_ENV"

      - name: Fingerprint is stable and independent of hostname
        run: |
          BEFORE=$(/opt/veritas/veritas-runtime --fingerprint)
          sudo hostname some-other-hostname
          AFTER=$(/opt/veritas/veritas-runtime --fingerprint)
          [ "$BEFORE" = "$AFTER" ] || { echo "fingerprint changed with hostname"; exit 1; }

      - name: Prepare license generator
        env:
          VERITAS_CI_PRIVATE_KEY_B64: ${{ secrets.VERITAS_CI_PRIVATE_KEY_B64 }}
        run: |
          test -n "$VERITAS_CI_PRIVATE_KEY_B64" || { echo "VERITAS_CI_PRIVATE_KEY_B64 secret is not set"; exit 1; }
          python3 -m venv /tmp/licvenv
          /tmp/licvenv/bin/pip install cryptography --quiet
          echo "$VERITAS_CI_PRIVATE_KEY_B64" | base64 -d > /tmp/ci_private_key.pem
          chmod 600 /tmp/ci_private_key.pem

      - name: No license — starts once, reports clearly, does not crash-loop
        run: |
          wait_failed() { for _ in $(seq 1 60); do systemctl is-failed --quiet veritas && return 0; sleep 3; done; return 1; }
          sudo systemctl start veritas
          wait_failed || { echo "service did not stop after missing license"; sudo journalctl -u veritas --no-pager | tail -30; exit 1; }
          NR=$(systemctl show -p NRestarts --value veritas)
          echo "NRestarts=$NR"
          [ "$NR" = "0" ] || { echo "service restarted $NR times without a license"; exit 1; }
          sudo journalctl -u veritas --no-pager | grep -q "license file not found" \
            || { echo "missing-license message not found"; sudo journalctl -u veritas --no-pager | tail -30; exit 1; }
          sudo systemctl reset-failed veritas || true

      - name: Wrong-machine license is rejected and shows this machine's fingerprint
        run: |
          /tmp/licvenv/bin/python3 tools/generate_license.py --org ci-test --tier enterprise \
            --expiry 2027-12-31 --fingerprint "v2:$(printf '0%.0s' {1..64})" \
            --key /tmp/ci_private_key.pem --out /tmp/wrong.vlic
          sudo cp /tmp/wrong.vlic /var/lib/veritas/veritas.vlic
          sudo chown veritas:veritas /var/lib/veritas/veritas.vlic
          wait_failed() { for _ in $(seq 1 60); do systemctl is-failed --quiet veritas && return 0; sleep 3; done; return 1; }
          sudo systemctl start veritas
          wait_failed || { echo "service did not stop for wrong-machine license"; exit 1; }
          sudo journalctl -u veritas --no-pager | grep -q "not valid for this machine" \
            || { sudo journalctl -u veritas --no-pager | tail -30; exit 1; }
          sudo journalctl -u veritas --no-pager | grep -q "$FP" \
            || { echo "error did not show this machine's fingerprint"; exit 1; }
          sudo systemctl reset-failed veritas || true

      - name: Old-format (v1) fingerprint license asks for a reissue
        run: |
          /tmp/licvenv/bin/python3 tools/generate_license.py --org ci-test --tier enterprise \
            --expiry 2027-12-31 --fingerprint "$(printf 'a%.0s' {1..64})" \
            --key /tmp/ci_private_key.pem --out /tmp/old.vlic
          sudo cp /tmp/old.vlic /var/lib/veritas/veritas.vlic
          sudo chown veritas:veritas /var/lib/veritas/veritas.vlic
          wait_failed() { for _ in $(seq 1 60); do systemctl is-failed --quiet veritas && return 0; sleep 3; done; return 1; }
          sudo systemctl start veritas
          wait_failed || { echo "service did not stop for old-format license"; exit 1; }
          sudo journalctl -u veritas --no-pager | grep -q "old machine fingerprint format" \
            || { sudo journalctl -u veritas --no-pager | tail -30; exit 1; }
          sudo systemctl reset-failed veritas || true

      - name: Machine-bound license (CLI fingerprint) activates via 'veritas license'
        run: |
          /tmp/licvenv/bin/python3 tools/generate_license.py --org ci-test --tier enterprise \
            --expiry 2027-12-31 --fingerprint "$FP" \
            --key /tmp/ci_private_key.pem --out /tmp/bound.vlic
          sudo veritas license /tmp/bound.vlic

      - name: Wait for the server (spaCy takes ~60s on CI)
        run: |
          for i in $(seq 1 36); do
            RESP=$(curl -sk https://localhost:8000/health 2>/dev/null || echo "")
            if echo "$RESP" | grep -q '"status":"ok"'; then echo "UP: $RESP"; exit 0; fi
            echo "  attempt $i/36 ($((i*5))s)"; sleep 5
          done
          sudo journalctl -u veritas --no-pager | tail -60
          exit 1

      - name: Endpoints
        run: |
          curl -sk https://localhost:8000/health | python3 -c "import sys,json; assert json.load(sys.stdin)['status']=='ok'"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8000/setup)" = "200"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8000/api/auth/me)" = "401"
          curl -sk https://localhost:8000/ready | python3 -m json.tool || true

      - name: Acceptance check command
        run: sudo veritas check

      - name: Restart keeps working
        run: |
          sudo veritas restart
          for i in $(seq 1 36); do
            curl -sk https://localhost:8000/health | grep -q '"status":"ok"' && exit 0
            sleep 5
          done
          sudo journalctl -u veritas --no-pager | tail -40
          exit 1

      - name: Support bundle holds diagnostics and no secrets
        run: |
          sudo veritas support-bundle /tmp/support.zip
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("/tmp/support.zip")
          names = z.namelist()
          for need in ("manifest.json", "license.json", "acceptance_check.json", "data_files.json", "settings.json"):
              assert need in names, f"{need} missing from {names}"
          assert not any(n.endswith((".db", ".key", ".vlic", ".pem", ".crt")) for n in names), names
          text = b"".join(z.read(n) for n in names).decode("utf-8", "replace")
          for forbidden in ("BEGIN PRIVATE KEY", "BEGIN RSA PRIVATE KEY", "BEGIN VERITAS LICENSE", "SQLite format"):
              assert forbidden not in text, forbidden
          print("support bundle ok:", names)
          PY
          sudo rm -f /tmp/support.zip

      - name: Backup, verify and restore
        run: |
          OUT=$(sudo veritas backup); echo "$OUT"
          BK=$(sed -n 's/^Backup created: //p' <<<"$OUT")
          test -n "$BK" || { echo "no backup path printed"; exit 1; }
          sudo veritas backups | grep -q "$(basename "$BK")" || { echo "backup not listed"; exit 1; }
          sudo veritas verify-backup "$BK" | grep -q "VERIFIED OK"
          # the bare name printed by `veritas backups` works as well as the full path
          sudo veritas verify-backup "$(basename "$BK")" | grep -q "VERIFIED OK"
          # a backup in a private folder is still readable by the command
          sudo mkdir -p /root/bk && sudo cp "$BK" /root/bk/private.zip
          sudo veritas verify-backup /root/bk/private.zip | grep -q "VERIFIED OK"
          # change something after the backup
          echo marker | sudo tee /var/lib/veritas/certs/added-after-backup.pem >/dev/null
          # a dry run changes nothing
          sudo veritas restore "$BK" --dry-run | grep -q "DRY RUN OK"
          sudo test -e /var/lib/veritas/certs/added-after-backup.pem || { echo "dry run changed data"; exit 1; }
          # the real restore: service stopped, data restored, service started again
          sudo veritas restore "$BK" | tee /tmp/restore.out
          grep -q "Restore complete. Veritas is running." /tmp/restore.out || { echo "restore did not wait for the server"; exit 1; }
          if sudo test -e /var/lib/veritas/certs/added-after-backup.pem; then echo "restore left a file that was not in the backup"; exit 1; fi
          sudo ls /var/lib/veritas/backups | grep -q '^pre-restore-' || { echo "no safety copy of the replaced data"; exit 1; }
          test "$(sudo stat -c '%U' /var/lib/veritas/users.db)" = "veritas" || { echo "restored files are not owned by the service account"; exit 1; }
          for i in $(seq 1 36); do
            curl -sk https://localhost:8000/health | grep -q '"status":"ok"' && break
            sleep 5
          done
          curl -sk https://localhost:8000/health | grep -q '"status":"ok"' || { sudo journalctl -u veritas --no-pager | tail -40; exit 1; }
          # a damaged file is refused and nothing is changed
          echo junk > /tmp/junk.zip
          if sudo veritas restore /tmp/junk.zip; then echo "a corrupt backup was accepted"; exit 1; fi
          curl -sk https://localhost:8000/health | grep -q '"status":"ok"' || { echo "service not running after a refused restore"; exit 1; }

      - name: Crash recovery (SIGKILL)
        run: |
          OLD=$(systemctl show -p MainPID --value veritas)
          sudo kill -9 "$OLD"
          for i in $(seq 1 36); do
            NEW=$(systemctl show -p MainPID --value veritas)
            if [ "$NEW" != "0" ] && [ "$NEW" != "$OLD" ] && curl -sk https://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "recovered: pid $OLD -> $NEW"; exit 0
            fi
            sleep 5
          done
          sudo journalctl -u veritas --no-pager | tail -40
          exit 1

      - name: Uninstall
        run: |
          sudo apt-get remove -y veritas
          if systemctl is-active --quiet veritas; then echo "service still running after remove"; exit 1; fi
          sudo apt-get purge -y veritas
          if id veritas >/dev/null 2>&1; then echo "user still exists after purge"; exit 1; fi
          test ! -d /var/lib/veritas

      # ── Upgrades: from the previous release, and the downgrade guard ─────
      - name: Upgrade from the previous release keeps everything
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_STATE: /tmp/upgrade-state.json
          VERITAS_URL: https://localhost:8000
          VERITAS_ORG: upgrade_org
          VERITAS_ADMIN_USER: upgrade_admin
          VERITAS_ADMIN_PASSWORD: Violet-Harbor#2468
          UPGRADE_LICENSE_B64: ${{ secrets.VERITAS_CI_UPGRADE_LICENSE_B64 }}
        run: |
          up() { for i in $(seq 1 60); do curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && return 0; sleep 5; done; return 1; }
          pip install requests >/dev/null
          PREV=$(gh api "repos/${{ github.repository }}/releases" --jq '[.[] | select(.draft == false and .tag_name != "'"$GITHUB_REF_NAME"'") | .tag_name][0]')
          test -n "$PREV" || { echo "no previous release found"; exit 1; }
          echo "previous release: $PREV"
          curl -fL --retry 3 -o /tmp/prev.deb "https://github.com/${{ github.repository }}/releases/download/$PREV/veritas_${PREV#v}_amd64.deb"
          sudo apt-get install -y /tmp/prev.deb
          rm -f /tmp/prev.deb
          # the previous release trusts only the production key, so it gets an any-machine license signed
          # with it (a license file, not the key); the build from this commit trusts the CI test key
          echo "$UPGRADE_LICENSE_B64" | base64 -d > /tmp/old-release.vlic
          sudo veritas license /tmp/old-release.vlic
          up || { echo "old release did not start"; sudo journalctl -u veritas --no-pager | tail -40; exit 1; }
          export VERITAS_SETUP_CODE=$(sudo veritas setup-code | grep -E '^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$')
          test -n "$VERITAS_SETUP_CODE" || { echo "no setup code"; exit 1; }
          python3 .github/scripts/upgrade_check.py seed
          BEFORE=$(sudo veritas backups | grep -c veritas-backup || true)
          # the release built from this commit, numbered above the previous one so it counts as an upgrade
          bash package/build-deb.sh dpdpa-agent/dist/veritas-runtime 99.0.0-ci amd64 >/dev/null
          sudo apt-get install -y ./dist/veritas_99.0.0-ci_amd64.deb
          test "$(veritas version)" = "Veritas 99.0.0-ci" || { echo "upgrade did not take: $(veritas version)"; exit 1; }
          # this build does not accept the previous release's license (different key, test only):
          # give it the CI one, then everything else must still be there
          sudo veritas license /tmp/bound.vlic
          up || { echo "new release did not start after the upgrade"; sudo journalctl -u veritas --no-pager | tail -40; exit 1; }
          python3 .github/scripts/upgrade_check.py verify
          AFTER=$(sudo veritas backups | grep -c veritas-backup || true)
          [ "$AFTER" -gt "$BEFORE" ] || { echo "no backup was made before the upgrade ($BEFORE before, $AFTER after)"; exit 1; }
          sudo veritas verify-backup "$(sudo veritas backups | awk 'NR==1{print $1}')" | grep -q "VERIFIED OK"

      - name: Downgrade is refused unless asked for, and the data survives
        env:
          UPGRADE_STATE: /tmp/upgrade-state.json
          VERITAS_URL: https://localhost:8000
          VERITAS_ORG: upgrade_org
          VERITAS_ADMIN_USER: upgrade_admin
          VERITAS_ADMIN_PASSWORD: Violet-Harbor#2468
        run: |
          up() { for i in $(seq 1 60); do curl -sk --max-time 3 "$VERITAS_URL/health" | grep -q '"status":"ok"' && return 0; sleep 5; done; return 1; }
          bash package/build-deb.sh dpdpa-agent/dist/veritas-runtime 98.0.0-ci amd64 >/dev/null
          # dpkg -i (unlike apt) installs an older package over a newer one: the package itself must refuse
          if sudo dpkg -i ./dist/veritas_98.0.0-ci_amd64.deb >/tmp/downgrade.out 2>&1; then
            echo "a downgrade was accepted"; cat /tmp/downgrade.out; exit 1
          fi
          grep -q "refusing to install" /tmp/downgrade.out || { echo "no clear reason given"; cat /tmp/downgrade.out; exit 1; }
          test "$(dpkg-query -W -f='${Version}' veritas)" = "99.0.0-ci" || { echo "the refused downgrade changed the installed version"; exit 1; }
          up || { echo "service not running after the refused downgrade"; sudo journalctl -u veritas --no-pager | tail -30; exit 1; }
          # on purpose: the marker file allows exactly one downgrade
          sudo touch /var/lib/veritas/ALLOW_DOWNGRADE
          sudo dpkg -i ./dist/veritas_98.0.0-ci_amd64.deb
          test "$(dpkg-query -W -f='${Version}' veritas)" = "98.0.0-ci" || { echo "the allowed downgrade did not install"; exit 1; }
          if sudo test -e /var/lib/veritas/ALLOW_DOWNGRADE; then echo "the marker was not consumed"; exit 1; fi
          up || { echo "service did not start after the downgrade"; sudo journalctl -u veritas --no-pager | tail -40; exit 1; }
          python3 .github/scripts/upgrade_check.py verify
          # the packaged program starts detection worker processes and they do the work
          echo "VERITAS_DETECTION_WORKERS=2" | sudo tee -a /etc/veritas/config.env >/dev/null
          sudo veritas restart
          EXPECT_WORKERS=2 python3 .github/scripts/check_detection.py

      - name: Collect logs on failure
        if: failure()
        run: |
          systemctl status veritas --no-pager || true
          sudo journalctl -u veritas --no-pager | tail -150 || true

      - name: Remove signing key
        if: always()
        run: rm -f /tmp/ci_private_key.pem /tmp/old-release.vlic
